<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DamaroX Jeopardy Deluxe</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #2563eb;
            --accent-gold: #f59e0b;
            --text-color: #f8fafc;
            --danger: #ef4444;
            --success: #22c55e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 { margin-bottom: 5px; color: var(--accent-gold); }

        /* Top Bar Control */
        .top-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button, input, select {
            padding: 10px 15px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        button {
            background-color: var(--accent-blue);
            color: white;
            transition: transform 0.1s, background 0.2s;
        }

        button:hover { opacity: 0.9; transform: translateY(-2px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .btn-gold { background-color: var(--accent-gold); color: black; }
        .btn-danger { background-color: var(--danger); }
        .btn-success { background-color: var(--success); }

        /* Main Container */
        .main-layout {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1400px;
        }

        /* Jeopardy Board */
        .board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            background-color: #0284c7;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .category-header {
            background-color: #0369a1;
            padding: 15px 5px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            text-transform: uppercase;
        }

        .card {
            background-color: #1e3a8a;
            color: var(--accent-gold);
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 90px;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
        }

        .card:hover { background-color: #1d4ed8; transform: scale(1.02); }
        .card.used { background-color: #334155; color: #64748b; cursor: not-allowed; transform: none; }

        /* Sidebar & Player Video Grid */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .players-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .player-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            border: 2px solid transparent;
        }

        .player-card.active-turn { border-color: var(--accent-gold); box-shadow: 0 0 15px rgba(245, 158, 11, 0.5); }
        .player-card.buzzed { border-color: var(--danger); box-shadow: 0 0 15px rgba(239, 68, 68, 0.8); }

        .video-box {
            width: 100%;
            height: 140px;
            background-color: #000;
            border-radius: 6px;
            object-fit: cover;
        }

        .player-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 5px;
            font-weight: bold;
        }

        /* Question Modal Overlay */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            max-width: 700px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            position: relative;
        }

        .question-text { font-size: 26px; margin-bottom: 20px; }
        .answer-text { font-size: 20px; color: var(--accent-gold); margin-top: 15px; display: none; }

        /* Buzzer Big Button */
        .buzzer-btn {
            width: 100%;
            padding: 20px;
            font-size: 24px;
            background-color: var(--danger);
            color: white;
            border-radius: 12px;
            margin-top: 20px;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.03); }
        }

        /* Settings Modal */
        .settings-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        .settings-box {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 10px;
            width: 350px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .settings-box select { width: 100%; background: #334155; color: white; margin-top: 5px; }

        .host-controls {
            margin-top: 15px;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>
<body>

    <h1>DamaroX Jeopardy Deluxe</h1>
    
    <div class="top-bar">
        <button id="btnSettings" onclick="openSettings()">⚙️ Audio/Video Settings</button>
        <button id="btnHost" class="btn-gold" onclick="startHost()">👑 Host werden</button>
        <input type="text" id="joinId" placeholder="Host-ID eingeben...">
        <button onclick="joinGame()">🎮 Spiel beitreten</button>
        <span id="myIdDisplay" style="align-self: center; font-size: 12px; opacity: 0.7;"></span>
    </div>

    <div class="main-layout">
        <!-- Jeopardy Spielfeld -->
        <div class="board" id="board"></div>

        <!-- Rechte Leiste: Spieler & Webcams -->
        <div class="sidebar">
            <h3>Spieler</h3>
            <div class="players-grid" id="playersGrid">
                <!-- Eigener Stream & Remote Streams landen hier -->
            </div>
        </div>
    </div>

    <!-- Fragen Modal -->
    <div class="modal" id="questionModal">
        <div class="modal-content">
            <div id="modalCategory" style="color: var(--accent-gold); font-weight: bold;">KATEGORIE</div>
            <div class="question-text" id="modalQuestion">Frage wird geladen...</div>
            <div class="answer-text" id="modalAnswer">Antwort: ...</div>

            <!-- Host Steuerung innerhalb der Frage -->
            <div id="hostQuestionControls" class="host-controls" style="display: none;">
                <p style="margin:0; font-size: 14px;">1. Wählen wer anfangen darf:</p>
                <div style="display:flex; gap:5px;">
                    <select id="selectStarterPlayer"></select>
                    <button class="btn-gold" onclick="assignTurn()">Auswählen</button>
                </div>
                
                <div id="hostRatingBtns" style="display: none; margin-top: 10px; gap: 10px; justify-content: center;">
                    <button class="btn-success" onclick="rateAnswer(true)">✅ Richtig (+Punkte)</button>
                    <button class="btn-danger" onclick="rateAnswer(false)">❌ Falsch (Buzzer frei!)</button>
                </div>
                <button style="margin-top: 10px;" onclick="toggleAnswer()">👁️ Antwort auflösen</button>
                <button class="btn-danger" onclick="closeModal()">Frage Schließen</button>
            </div>

            <!-- Status-Anzeige -->
            <div id="turnStatus" style="margin-top: 15px; font-weight: bold;"></div>

            <!-- Buzzer Button für Spieler -->
            <button id="buzzerBtn" class="buzzer-btn" style="display: none;" onclick="sendBuzzer()">🔔 BUZZER!</button>
        </div>
    </div>

    <!-- Einstellungen Modal -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-box">
            <h3>⚙️ Geräte-Einstellungen</h3>
            <label>
                Kamera:
                <select id="videoSource"></select>
            </label>
            <label>
                Mikrofon:
                <select id="audioSource"></select>
            </label>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="btn-success" style="flex:1" onclick="applySettings()">Speichern</button>
                <button class="btn-danger" onclick="closeSettings()">Abbrechen</button>
            </div>
        </div>
    </div>

    <script>
        // --- JEOPARDY FRAGEN ---
        const gameData = [
            { category: "Gaming", cards: [
                { points: 100, q: "Wie heißt die Hauptfigur in 'The Legend of Zelda'?", a: "Link" },
                { points: 200, q: "Welches Spiel ist das meistveraufte aller Zeiten?", a: "Minecraft" },
                { points: 300, q: "Wie heißt die Welt, in der World of Warcraft spielt?", a: "Azeroth" }
            ]},
            { category: "Internet", cards: [
                { points: 100, q: "Wofür steht die Abkürzung 'WWW'?", a: "World Wide Web" },
                { points: 200, q: "In welchem Jahr wurde YouTube gegründet?", a: "2005" },
                { points: 300, q: "Wie heißt das Maskottchen von GitHub?", a: "Octocat" }
            ]},
            { category: "Filme", cards: [
                { points: 100, q: "Wie heißt der grüne Oger von DreamWorks?", a: "Shrek" },
                { points: 200, q: "Welches Metall ist im Schild von Captain America?", a: "Vibranium" },
                { points: 300, q: "Wie viele Ringe der Macht wurden den Menschen gegeben?", a: "9" }
            ]},
            { category: "Technik", cards: [
                { points: 100, q: "Was bedeutet die Abkürzung CPU?", a: "Central Processing Unit" },
                { points: 200, q: "Welches Betriebssystem basiert auf dem Linux-Kernel?", a: "Android (oder Ubuntu/Debian etc.)" },
                { points: 300, q: "Wofür steht RAM im Computer?", a: "Random Access Memory" }
            ]},
            { category: "DamaroX Special", cards: [
                { points: 100, q: "Welche Farbe hat der Bestseller-Buzzer?", a: "Rot" },
                { points: 200, q: "Welcher Streamer/Creator baut dieses Jeopardy?", a: "DamaroX" },
                { points: 300, q: "Was ist 42?", a: "Die Antwort auf die Frage nach dem Leben, dem Universum und dem ganzen Rest" }
            ]}
        ];

        // --- GLOBALE VARIABLEN ---
        let peer = null;
        let connections = []; // Nur für Host
        let hostConn = null;  // Nur für Client
        let isHost = false;
        let myStream = null;
        let myName = "Spieler_" + Math.floor(Math.random() * 1000);
        let players = {}; // id -> { name, score, stream }

        let activeCard = null;
        let currentAnsweringPlayer = null;
        let buzzerAllowed = false;
        let playerWhoFailedFirst = null;

        // --- INIT & DEVICES ---
        window.onload = async () => {
            initBoard();
            await getDevices();
            startLocalStream();
        };

        function initBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            
            // Header
            gameData.forEach(cat => {
                const head = document.createElement('div');
                head.className = 'category-header';
                head.innerText = cat.category;
                boardEl.appendChild(head);
            });

            // Grid Cards
            for (let r = 0; r < 3; r++) {
                gameData.forEach((cat, cIdx) => {
                    const cardData = cat.cards[r];
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerText = cardData.points;
                    card.id = `card-${cIdx}-${r}`;
                    card.onclick = () => onCardClick(cIdx, r);
                    boardEl.appendChild(card);
                });
            }
        }

        // --- STREAM & SETTINGS ---
        async function getDevices() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoSelect = document.getElementById('videoSource');
                const audioSelect = document.getElementById('audioSource');
                
                videoSelect.innerHTML = '';
                audioSelect.innerHTML = '';

                devices.forEach(device => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    if (device.kind === 'videoinput') {
                        option.text = device.label || `Kamera ${videoSelect.length + 1}`;
                        videoSelect.appendChild(option);
                    } else if (device.kind === 'audioinput') {
                        option.text = device.label || `Mikrofon ${audioSelect.length + 1}`;
                        audioSelect.appendChild(option);
                    }
                });
            } catch (e) { console.error("Geräte konnten nicht geladen werden", e); }
        }

        async function startLocalStream(videoId = null, audioId = null) {
            try {
                if (myStream) {
                    myStream.getTracks().forEach(track => track.stop());
                }
                const constraints = {
                    video: videoId ? { deviceId: { exact: videoId } } : true,
                    audio: audioId ? { deviceId: { exact: audioId } } : true
                };
                myStream = await navigator.mediaDevices.getUserMedia(constraints);
                
                // My local UI element
                addOrUpdatePlayerCard('me', myName, 0, myStream, true);
                await getDevices(); // Labels nach Permission neu laden
            } catch (err) {
                alert("Kamera/Mikrofon Fehler: " + err.message);
            }
        }

        function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }
        
        async function applySettings() {
            const vId = document.getElementById('videoSource').value;
            const aId = document.getElementById('audioSource').value;
            await startLocalStream(vId, aId);
            closeSettings();
        }

        // --- NETZWERK (PEERJS) ---
        function startHost() {
            isHost = true;
            peer = new Peer();

            peer.on('open', id => {
                document.getElementById('myIdDisplay').innerText = "HOST-ID: " + id;
                document.getElementById('btnHost').disabled = true;
                players[id] = { name: myName + " (Host)", score: 0 };
                updatePlayerListUI();
            });

            peer.on('connection', conn => {
                connections.push(conn);
                conn.on('data', data => handleDataFromClient(data, conn));
            });

            peer.on('call', call => {
                call.answer(myStream);
                call.on('stream', remoteStream => {
                    addOrUpdatePlayerCard(call.peer, players[call.peer]?.name || "Spieler", players[call.peer]?.score || 0, remoteStream);
                });
            });
        }

        function joinGame() {
            const hostId = document.getElementById('joinId').value.trim();
            if (!hostId) return alert("Bitte Host-ID eingeben!");

            peer = new Peer();
            peer.on('open', id => {
                hostConn = peer.connect(hostId);
                hostConn.on('open', () => {
                    hostConn.send({ type: 'JOIN', name: myName });
                });

                hostConn.on('data', data => handleDataFromHost(data));

                peer.on('call', call => {
                    call.answer(myStream);
                    call.on('stream', remoteStream => {
                        addOrUpdatePlayerCard(call.peer, "Host/Spieler", 0, remoteStream);
                    });
                });

                // Call host
                peer.call(hostId, myStream);
            });
        }

        // --- HOST LOGIK ---
        function handleDataFromClient(data, conn) {
            if (data.type === 'JOIN') {
                players[conn.peer] = { name: data.name, score: 0 };
                broadcastState();
            }
            if (data.type === 'BUZZER') {
                if (buzzerAllowed && !currentAnsweringPlayer) {
                    currentAnsweringPlayer = conn.peer;
                    buzzerAllowed = false; // Sperren für den Rest
                    broadcast({ type: 'PLAYER_BUZZED', playerId: conn.peer });
                }
            }
        }

        function broadcast(msg) {
            connections.forEach(c => c.send(msg));
            handleDataFromHost(msg); // Für den Host selbst
        }

        function broadcastState() {
            broadcast({ type: 'STATE_UPDATE', players, gameData });
        }

        // --- CLIENT RECEIVE LOGIK ---
        function handleDataFromHost(data) {
            if (data.type === 'STATE_UPDATE') {
                players = data.players;
                updatePlayerListUI();
            }
            if (data.type === 'OPEN_QUESTION') {
                activeCard = data.card;
                document.getElementById('modalCategory').innerText = data.category;
                document.getElementById('modalQuestion').innerText = activeCard.q;
                document.getElementById('modalAnswer').innerText = "Antwort: " + activeCard.a;
                document.getElementById('modalAnswer').style.display = 'none';
                document.getElementById('questionModal').style.display = 'flex';
                document.getElementById('buzzerBtn').style.display = 'none';
                document.getElementById('turnStatus').innerText = "Warte auf Host-Auswahl...";

                if (isHost) {
                    setupHostStarterSelect();
                }
            }
            if (data.type === 'SET_TURN') {
                currentAnsweringPlayer = data.playerId;
                const pName = players[data.playerId]?.name || "Unbekannt";
                document.getElementById('turnStatus').innerText = `👉 AM ZUG: ${pName}`;
                
                // Visual Highlight
                highlightActivePlayer(data.playerId);

                if (isHost) {
                    document.getElementById('hostRatingBtns').style.display = 'flex';
                }
            }
            if (data.type === 'ENABLE_BUZZER') {
                currentAnsweringPlayer = null;
                buzzerAllowed = true;
                document.getElementById('turnStatus').innerText = "❌ FALSCH! BUZZER FREIGESCHALTET!";
                
                // Zeige Buzzer nur, wenn man NICHT der erste gescheiterte Spieler ist
                if (peer.id !== data.failedPlayerId) {
                    document.getElementById('buzzerBtn').style.display = 'block';
                }
            }
            if (data.type === 'PLAYER_BUZZED') {
                currentAnsweringPlayer = data.playerId;
                buzzerAllowed = false;
                document.getElementById('buzzerBtn').style.display = 'none';
                const pName = players[data.playerId]?.name || "Unbekannt";
                document.getElementById('turnStatus').innerText = `🔔 GEBUZZERT VON: ${pName}!`;
                highlightActivePlayer(data.playerId, true);

                if (isHost) {
                    document.getElementById('hostRatingBtns').style.display = 'flex';
                }
            }
            if (data.type === 'CLOSE_QUESTION') {
                document.getElementById('questionModal').style.display = 'none';
                highlightActivePlayer(null);
            }
        }

        // --- JEOPARDY STEUERUNG ---
        function onCardClick(c, r) {
            if (!isHost) return;
            const card = gameData[c].cards[r];
            if (card.used) return;
            
            card.used = true;
            document.getElementById(`card-${c}-${r}`).classList.add('used');
            
            playerWhoFailedFirst = null;
            currentAnsweringPlayer = null;
            buzzerAllowed = false;

            broadcast({
                type: 'OPEN_QUESTION',
                category: gameData[c].category,
                card: card
            });
        }

        function setupHostStarterSelect() {
            document.getElementById('hostQuestionControls').style.display = 'block';
            document.getElementById('hostRatingBtns').style.display = 'none';
            const sel = document.getElementById('selectStarterPlayer');
            sel.innerHTML = '';
            
            Object.keys(players).forEach(pId => {
                const opt = document.createElement('option');
                opt.value = pId;
                opt.innerText = players[pId].name;
                sel.appendChild(opt);
            });
        }

        function assignTurn() {
            const pId = document.getElementById('selectStarterPlayer').value;
            broadcast({ type: 'SET_TURN', playerId: pId });
        }

        function rateAnswer(isCorrect) {
            if (!currentAnsweringPlayer) return;

            if (isCorrect) {
                players[currentAnsweringPlayer].score += activeCard.points;
                broadcastState();
                closeModal();
            } else {
                players[currentAnsweringPlayer].score -= activeCard.points;
                playerWhoFailedFirst = currentAnsweringPlayer;
                broadcastState();
                
                // Jetzt Buzzer freischalten!
                broadcast({ type: 'ENABLE_BUZZER', failedPlayerId: playerWhoFailedFirst });
            }
        }

        function sendBuzzer() {
            if (!buzzerAllowed) return;
            if (isHost) {
                handleDataFromClient({ type: 'BUZZER' }, { peer: peer.id });
            } else {
                hostConn.send({ type: 'BUZZER' });
            }
        }

        function toggleAnswer() {
            const a = document.getElementById('modalAnswer');
            a.style.display = a.style.display === 'none' ? 'block' : 'none';
        }

        function closeModal() {
            if (isHost) {
                broadcast({ type: 'CLOSE_QUESTION' });
            }
        }

        // --- UI HELPERS ---
        function addOrUpdatePlayerCard(id, name, score, stream, isMe = false) {
            let container = document.getElementById('player-' + id);
            if (!container) {
                container = document.createElement('div');
                container.className = 'player-card';
                container.id = 'player-' + id;
                
                const video = document.createElement('video');
                video.className = 'video-box';
                video.autoplay = true;
                video.playsInline = true;
                if (isMe) video.muted = true;
                
                const info = document.createElement('div');
                info.className = 'player-info';
                info.innerHTML = `<span class="p-name">${name}</span><span class="p-score">${score} P</span>`;
                
                container.appendChild(video);
                container.appendChild(info);
                document.getElementById('playersGrid').appendChild(container);
            }

            if (stream) {
                const v = container.querySelector('video');
                v.srcObject = stream;
            }

            container.querySelector('.p-name').innerText = name;
            container.querySelector('.p-score').innerText = score + " P";
        }

        function updatePlayerListUI() {
            Object.keys(players).forEach(pId => {
                addOrUpdatePlayerCard(pId, players[pId].name, players[pId].score, null, pId === peer?.id);
            });
        }

        function highlightActivePlayer(pId, buzzed = false) {
            document.querySelectorAll('.player-card').forEach(c => {
                c.classList.remove('active-turn', 'buzzed');
            });
            if (pId) {
                const target = document.getElementById('player-' + pId);
                if (target) {
                    target.classList.add(buzzed ? 'buzzed' : 'active-turn');
                }
            }
        }
    </script>
</body>
</html>
